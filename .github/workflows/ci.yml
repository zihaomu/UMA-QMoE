name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-plane:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Check critical Python errors
        run: uv run --frozen --with ruff==0.12.11 ruff check --select=E9,F63,F7,F82 src tests

      - name: Run unit tests
        run: uv run --frozen pytest -q

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q src tests

      - name: Validate public contracts and manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r document; do
            uv run --frozen umaq validate "$document"
          done < <(
            find benchmarks/contracts models/estimates models/inventories models/manifests \
              -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) \
              -print | LC_ALL=C sort
          )

      - name: Build package artifacts
        run: uv build
