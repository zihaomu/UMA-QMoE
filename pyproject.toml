[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "uma-qmoe"
version = "0.1.0"
description = "Contracts and tooling for quantization-native MoE inference on UMA systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
conversion = [
  "numpy>=2.0,<3",
]
dev = [
  "numpy>=2.0,<3",
  "pytest>=8.3,<9",
]

[project.scripts]
umaq = "uma_qmoe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uma_qmoe"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
